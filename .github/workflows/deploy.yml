name: Deploy Frontend and Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 'Az CLI login via OIDC'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: push to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          
          SERVER_TAG="${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}"
          docker build -t $SERVER_TAG ./Server
          docker push $SERVER_TAG

          CLIENT_TAG="${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}"
          docker build -t $CLIENT_TAG ./Client
          docker push $CLIENT_TAG

      - name: Deploy to azure
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}"
          
          az containerapp update \
            --name ${{ secrets.CLIENT_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}"

